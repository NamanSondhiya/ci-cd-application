name: Build and Push Docker Images

on:
  push:
    branches:
      - master02

jobs:
  build-and-push:
    name: Build and Push Docker Images to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            namanss/ci-cd-frontend:latest
            namanss/ci-cd-frontend:${{ github.sha }}

      - name: Build and push Backend image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            namanss/ci-cd-backend:latest
            namanss/ci-cd-backend:${{ github.sha }}

      - name: Update docker-compose.yml for production
        run: |
          sed -i 's|build: ./frontend|image: namanss/ci-cd-frontend:latest|g' docker-compose.yml
          sed -i 's|build: ./backend|image: namanss/ci-cd-backend:latest|g' docker-compose.yml
          
      - name: Deploy with docker-compose (if needed)
        run: |
          echo "Images pushed successfully!"
          echo "Frontend: namanss/ci-cd-frontend:latest"
          echo "Backend: namanss/ci-cd-backend:latest"