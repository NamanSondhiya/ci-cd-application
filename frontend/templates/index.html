<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collab CI/CD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Collaborative CI/CD Pipeline</h1>
    <p>Streamline your development workflow with automated testing, building, and deployment.</p>
    <p>This is the frontend</p>
    <p id="tools-list">Loading tools...</p>
    <script>
        fetch('{{ backend_url }}/jet')
            .then(response => response.json())
            .then(tools => {
                const toolsList = document.querySelectorAll('p');
                toolsList[toolsList.length - 1].innerHTML = tools.join(', ');
            })
            .catch(error => {
                const toolsList = document.querySelectorAll('p');
                toolsList[toolsList.length - 1].innerHTML = 'Error loading tools';
            });
    </script>
</body>
<style>
    body {
        background-color: black;
        text-align: center;
        font-size: larger;
    }
    h1 {
        color: chartreuse;
        margin-top: 50px;
        font-size: larger;
    }
    p {
        color: darkgoldenrod;
        font-size: x-large;
    }
</style>
</html>
